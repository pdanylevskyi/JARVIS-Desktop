name: Build installers
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.draft.outputs.tag }}
    steps:
      - id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          tag="preview-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" --draft --target "$TARGET_SHA" --title "JARVIS 0.3.0 preview · build ${GITHUB_RUN_NUMBER}" --notes "Local text-model installer with optional SSH backend. See INSTALL.md. macOS and Windows publisher signing are not configured."
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      JARVIS_VERSION: 0.3.0
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3 libasound2 libvulkan1
      - if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - run: python -m pip install -r desktop/requirements.txt pyinstaller==6.20.0
      - run: python packaging/check_public.py
      - run: python -m unittest desktop.test_client desktop.test_webapp desktop.test_hardware desktop.test_local_runtime
      - run: python packaging/smoke_runtime.py
      - run: python desktop/build.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a dist/JARVIS/JARVIS --self-test
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      - if: runner.os == 'macOS'
        run: dist/JARVIS.app/Contents/MacOS/JARVIS --self-test
      - if: runner.os == 'Windows'
        run: |
          $p = Start-Process dist/JARVIS/JARVIS.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - run: python packaging/package.py
      - name: Upload installers to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" release/* --clobber
