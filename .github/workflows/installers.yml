name: Build installers
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      JARVIS_VERSION: 0.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2 xvfb libegl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libnss3 libasound2
      - if: runner.os == 'Windows'
        run: choco install innosetup -y --no-progress
      - run: python -m pip install -r desktop/requirements.txt pyinstaller==6.20.0
      - run: python packaging/check_public.py
      - run: python -m unittest desktop.test_client desktop.test_webapp
      - run: python desktop/build.py
      - if: runner.os == 'Linux'
        run: xvfb-run -a dist/JARVIS/JARVIS --self-test
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
      - if: runner.os == 'macOS'
        run: dist/JARVIS.app/Contents/MacOS/JARVIS --self-test
      - if: runner.os == 'Windows'
        run: |
          $p = Start-Process dist/JARVIS/JARVIS.exe -ArgumentList '--self-test' -Wait -PassThru
          if ($p.ExitCode -ne 0) { exit $p.ExitCode }
      - run: python packaging/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-${{ matrix.os }}-installer
          path: release/*
          if-no-files-found: error
          retention-days: 30
